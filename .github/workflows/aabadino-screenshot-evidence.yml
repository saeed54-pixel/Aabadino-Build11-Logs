name: Export Aabadino screenshots for visual review

on:
  push:
    branches: [main]
    paths:
      - "*.jpg"
      - "*.jpeg"
      - "*.png"
      - "scerinshot.zip"
      - ".github/workflows/aabadino-screenshot-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out screenshot evidence
        uses: actions/checkout@v4

      - name: Check out Aabadino source artwork
        uses: actions/checkout@v4
        with:
          repository: saeed54-pixel/Aabadino
          ref: fix/build34-empty-scene-setup
          path: aabadino-project

      - name: Collect uploaded screenshots and screenshot archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/root evidence/archive evidence/project-assets evidence/build47
          shopt -s nullglob
          for file in *.jpg *.jpeg *.png; do
            cp -- "$file" evidence/root/
          done
          for asset in aabadino-project/assets/abadino_boot_splash.png aabadino-project/assets/characters/player_avatars_atlas.png aabadino-project/UnityProject/Assets/Resources/Aabadino/Startup/AabadinoSplash.png aabadino-project/UnityProject/Assets/Resources/Aabadino/UI/PlayerAvatarsAtlas.png; do
            if [ -f "$asset" ]; then cp -- "$asset" evidence/project-assets/; fi
          done
          if [ -f build47.zip ]; then
            while IFS= read -r entry; do
              case "${entry,,}" in
                *.png|*.jpg|*.jpeg|*.webp)
                  base=$(basename "$entry")
                  unzip -p build47.zip "$entry" > "evidence/build47/$base"
                  ;;
              esac
            done < <(unzip -Z1 build47.zip)
          fi
          if [ -f scerinshot.zip ]; then
            unzip -q scerinshot.zip -d evidence/archive
          fi
          find evidence -type f -printf '%p %s bytes\\n' | sort

      - name: Upload image evidence
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Aabadino-Screenshot-Evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 3

# Collects existing screenshots only; does not invoke Unity or consume Unity build quota.
